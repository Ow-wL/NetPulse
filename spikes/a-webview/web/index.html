<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>NetPulse Spike A</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-a"></div><div class="orb orb-b"></div><div class="orb orb-c"></div>
  </div>

  <nav class="glass glass-control rail" aria-label="탐색">
    <div class="brand"><span class="pulse-dot"></span>NetPulse</div>
    <button class="nav-item active" data-page="monitor" id="nav-monitor">측정</button>
    <button class="nav-item" data-page="diagnose" id="nav-diagnose">진단</button>
    <div class="spacer"></div>
    <button class="nav-item" id="theme-toggle" aria-label="테마 전환">테마 전환</button>
  </nav>

  <main>
    <section class="page" id="page-monitor">
      <h1 class="page-title">실시간 측정</h1>
      <div class="chart-wrap">
        <canvas id="chart" aria-label="실시간 지연 그래프"></canvas>
        <div class="glass glass-content overlay overlay-status">
          <div class="label">지금 상태</div>
          <div class="headline" id="status-text">측정 준비 중</div>
          <div class="glass glass-float nested">
            <div class="label">현재 회차</div>
            <div class="big" id="round">—</div>
          </div>
        </div>
        <div class="glass glass-content overlay overlay-metric">
          <div class="label">외부 지연</div>
          <div class="big" id="latency">— ms</div>
          <div class="label" id="late">예정 대비 —</div>
        </div>
      </div>
      <div class="glass glass-control toolbar">
        <button class="btn primary" id="mark">증상 표시</button>
        <input class="memo" id="memo" placeholder="메모" aria-label="메모" maxlength="40">
        <span class="label" id="probes">진단 API 확인 중</span>
      </div>
    </section>

    <section class="page hidden" id="page-diagnose">
      <h1 class="page-title">빠른 진단</h1>
      <div class="cards">
        <div class="glass glass-content card"><div class="label">어댑터</div><div class="big ok">정상</div></div>
        <div class="glass glass-content card"><div class="label">게이트웨이</div><div class="big ok">정상</div></div>
        <div class="glass glass-content card"><div class="label">DNS</div><div class="big warn">확인</div></div>
        <div class="glass glass-content card"><div class="label">HTTPS</div><div class="big ok">정상</div></div>
      </div>
    </section>
  </main>

  <div id="ready" hidden></div>
  <script src="app.js"></script>
</body>
</html>
